name: FoCient CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    name: Lint, Test & Typecheck Per Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: npm install

      - name: Verify Design Tokens (100% Inter & WCAG AAA)
        run: |
          npm run generate:tokens
          npm run test:tokens

      - name: Typecheck Contracts & Server
        run: |
          npm run typecheck:contracts
          npm run typecheck:server

      - name: Test & Typecheck Web
        run: |
          npm run test:web
          npm run typecheck:web

      - name: Test Mobile Client (Flutter)
        run: |
          cd apps/mobile
          flutter test
