name: FoCient CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate-and-test:
    name: Build, Migrate, Test & Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: focient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/focient_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: focient_super_secure_ci_test_secret_32_characters_minimum!
      JWT_REFRESH_SECRET: focient_super_secure_refresh_ci_test_secret_32_chars!
      OTP_SECRET: focient_super_secure_otp_ci_test_secret_32_chars_minimum!
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Clean Install Dependencies (npm ci)
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --prefix packages/database

      - name: Apply Database Migrations (Prisma Migrate Deploy)
        run: npx prisma migrate deploy --schema=packages/database/schema.prisma

      - name: Verify Design Tokens (100% Inter & WCAG AAA)
        run: |
          npm run generate:tokens
          npm run test:tokens

      - name: Typecheck Monorepo Packages
        run: npm run typecheck

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Test Server & PostgreSQL-Backed API Integration
        run: |
          npx tsx --test apps/server/test/postgres-integration.test.ts
          npm run test:server

      - name: Test Web & Browser E2E Accessibility (WCAG AAA)
        run: npm run test:web

      - name: Enforce Coverage Thresholds
        run: npm run test:coverage

      - name: Run Production Smoke Tests
        run: npm run smoke

      - name: Analyze & Test Mobile Client (Flutter)
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos
          flutter test --reporter=expanded

      - name: Dependency & Security Vulnerability Scan
        run: |
          npm run security:scan || true
          npm audit --audit-level=high || true

  docker-build:
    name: Docker Build Verification
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: focient-server:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: focient-web:test
