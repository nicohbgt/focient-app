name: focient_mobile
description: FoCient Mobile Client (Android & iOS) - Focus & Efficient with Guilt-Free Productivity
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  reorderables: ^0.6.0
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.10.10
  google_sign_in: ^6.2.1
  http: ^1.2.2
  focient_ui_tokens:
    path: ../../packages/ui-tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
